<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F1EA" />
  <title>Isaks pluggbibliotek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./">
        <span class="mark">IP</span>
        <span class="name">Isaks pluggbibliotek</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="kicker">Plugga inför läxförhör och prov</p>
      <h1>Vad vill du öva på?</h1>
      <label class="search" for="q">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="Sök ämne: matte, fysik, kemi, joner…" autocomplete="off" />
      </label>
      <div class="chips" id="chips" role="tablist" aria-label="Ämnen"></div>
    </section>

    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty hidden" id="empty">Inget matchade sökningen. Prova <b>matte</b>, <b>fysik</b> eller <b>joner</b>.</p>
  </main>

  <footer>
    <span>Isaks pluggbibliotek</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
